[versions]
java = "21"
kotlin = "2.4.21"
coroutines = "1.11.0"
jackson = "2.23.0"
graal = "25.5.5.0.3"
junit = "6.1.3"
spek = "1.1.5"
jmh = "1.37"
dokka = "2.3.0"
spotless = "8.11.0"
googleJavaFormat = "2.0.0"
ktlint = "1.8.0"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
reflections = { module = "org.reflections:reflections", version = "0.10.2" }
commons-text = { module = "org.apache.commons:commons-text", version = "1.15.0" }

jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version = "7.8.1.202611041320-r" }
typesafe-config = { module = "com.typesafe:config", version = "1.4.10" }
graal-polyglot = { module = "org.graalvm.polyglot:polyglot", version.ref = "graal" }
graal-js = { module = "org.graalvm.polyglot:js-community", version.ref = "graal" }
toml4j = { module = "com.moandjiezana.toml:toml4j", version = "0.7.2" }
dom4j = { module = "org.dom4j:dom4j", version = "2.2.0" }
jaxen = { module = "jaxen:jaxen", version = "2.0.6" }
snakeyaml = { module = "org.yaml:snakeyaml", version = "2.7" }

hamkrest = { module = "com.natpryce:hamkrest", version = "1.8.0.1" }
hamcrest-all = { module = "org.hamcrest:hamcrest-all", version = "1.3" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spek-api = { module = "org.jetbrains.spek:spek-api", version.ref = "spek" }
spek-data-driven = { module = "org.jetbrains.spek:spek-data-driven-extension", version.ref = "spek" }
spek-subject = { module = "org.jetbrains.spek:spek-subject-extension", version.ref = "spek" }
spek-engine = { module = "org.jetbrains.spek:spek-junit-platform-engine", version.ref = "spek" }
spark-core = { module = "com.sparkjava:spark-core", version = "2.9.4" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version = "2.0.20" }

# Gradle plugins used by the buildSrc convention plugins
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
gradlePlugin-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
gradlePlugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
gradlePlugin-jmh = { module = "me.champeau.jmh:jmh-gradle-plugin", version = "0.7.4" }

[plugins]
versions = { id = "io.github.ben-manes.versions", version = "0.67.0" }
task-tree = { id = "com.dorongold.task-tree", version = "4.0.2" }
